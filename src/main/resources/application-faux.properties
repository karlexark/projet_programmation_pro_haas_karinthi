# Profil "faux" : aucun modele n'est appele, l'agent renvoie une reponse fixe.
# Lancement : ./gradlew bootRun --args='--spring.profiles.active=faux'
descripteur.fournisseur=faux

# Temps d'attente simule avant chaque reponse (pour tester le message d'attente)
descripteur.faux.delai=PT2S

# Decommenter pour simuler une panne de l'agent
# (AGENT_INDISPONIBLE, DELAI_DEPASSE, REPONSE_VIDE ou INCONNUE)
#descripteur.faux.echec=AGENT_INDISPONIBLE
