spring.application.name=audiodescription

# Taille maximale des images envoyees (Spring refuse au-dela de 1 Mo par defaut)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Agent : adresse d'Ollama (sur la VM). Surchargeable par la variable d'environnement OLLAMA_URL.
descripteur.ollama.url=${OLLAMA_URL:http://localhost:11434}
descripteur.ollama.modele=${OLLAMA_MODELE:qwen2.5vl}
descripteur.ollama.timeout=PT2M
