spring.application.name=audiodescription

# Taille maximale des images envoyees (Spring refuse au-dela de 1 Mo par defaut)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Fournisseur de l'agent : ollama (par defaut) ou faux (reponse fixe, sans modele).
# Surchargeable par la variable d'environnement DESCRIPTEUR_FOURNISSEUR, ou par le profil "faux".
descripteur.fournisseur=${DESCRIPTEUR_FOURNISSEUR:ollama}

# Fournisseur Ollama. Surchargeable par les variables d'environnement OLLAMA_URL et OLLAMA_MODELE.
descripteur.ollama.url=${OLLAMA_URL:http://localhost:11434}
descripteur.ollama.modele=${OLLAMA_MODELE:qwen2.5vl:7b}
descripteur.ollama.timeout=PT2M
