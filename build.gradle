plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'com.github.spotbugs' version '6.5.13'
    id 'checkstyle'
}

group = 'fr.troisil'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'dev.langchain4j:langchain4j-ollama:1.21.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy 'jacocoTestReport'
}

// Couverture des tests : rapport dans build/reports/jacoco/test/html/index.html
jacoco {
    toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport') {
    dependsOn 'test'
    reports {
        xml.required = true
        html.required = true
    }
}

// Couverture minimale exigée : ./gradlew check échoue en dessous.
tasks.named('jacocoTestCoverageVerification') {
    dependsOn 'test'
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.85
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.75
            }
        }
    }
}

tasks.named('check') {
    dependsOn 'jacocoTestCoverageVerification'
}

// Analyse statique du code compilé : rapport dans build/reports/spotbugs/main.html
spotbugs {
    toolVersion = '4.10.5'
    effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('LOW')
}

// Le plugin de Spring Boot impose sa version de commons-lang3 (3.17) à toutes les configurations,
// y compris celle de SpotBugs, qui a besoin de la 3.21. On rétablit la bonne version pour SpotBugs seulement.
configurations.named('spotbugs') {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.apache.commons' && details.requested.name == 'commons-lang3') {
            details.useVersion '3.21.0'
        }
    }
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html.required = true
        xml.required = true
    }
}

// Conventions d'écriture : règles dans config/checkstyle/checkstyle.xml,
// rapport dans build/reports/checkstyle/main.html. Aucune infraction tolérée.
checkstyle {
    toolVersion = '14.3.0'
    maxWarnings = 0
    maxErrors = 0
}
